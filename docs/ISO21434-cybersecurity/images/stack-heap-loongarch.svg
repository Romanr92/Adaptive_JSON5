<svg xmlns="http://www.w3.org/2000/svg" width="769" height="502" viewBox="0 0 769 502" font-family="Helvetica, Arial, sans-serif" fill="#0f172a">
<defs><marker id="arrow-code" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#3b6fb6"/></marker><marker id="arrow-ro" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#3b6fb6"/></marker><marker id="arrow-data" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#2f8f5b"/></marker><marker id="arrow-bss" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#2f8f5b"/></marker><marker id="arrow-heap" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#b7791f"/></marker><marker id="arrow-free" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/></marker><marker id="arrow-stack" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#be3f86"/></marker><marker id="arrow-guard" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#c53030"/></marker><marker id="arrow-kernel" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#6b7280"/></marker><marker id="arrow-map" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#7e57c2"/></marker><marker id="arrow-vec" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#4f5bd5"/></marker><marker id="arrow-os" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#c2620f"/></marker><marker id="arrow-buf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#0f8a7e"/></marker></defs>
<rect width="769" height="502" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="bold">LoongArch: stack direction is a software convention</text>
<text x="210.0" y="66" text-anchor="middle" font-weight="bold" font-size="15">Process (Linux)</text>
<rect x="80" y="80" width="260" height="40" fill="#e5e7eb" stroke="#334155" stroke-width="1.2"/>
<text x="210.0" y="105.0" text-anchor="middle" font-size="13" font-weight="bold">Kernel space</text>
<rect x="80" y="120" width="260" height="76" fill="#fbcfe8" stroke="#334155" stroke-width="1.2"/>
<text x="210.0" y="155.0" text-anchor="middle" font-size="13" font-weight="bold">Stack</text>
<text x="210.0" y="171.0" text-anchor="middle" font-size="11" font-weight="normal">$sp = $r3, 16-byte aligned</text>
<text x="352" y="162.0" font-size="11" fill="#334155">by psABI convention</text>
<rect x="80" y="196" width="260" height="110" fill="#f8fafc" stroke="#334155" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="210.0" y="256.0" text-anchor="middle" font-size="13" font-weight="bold">free / mappings</text>
<rect x="80" y="306" width="260" height="56" fill="#fde68a" stroke="#334155" stroke-width="1.2"/>
<text x="210.0" y="331.0" text-anchor="middle" font-size="13" font-weight="bold">Heap</text>
<text x="210.0" y="347.0" text-anchor="middle" font-size="11" font-weight="normal">malloc / new</text>
<text x="352" y="338.0" font-size="11" fill="#334155">Adaptive_JSON5 parser library: not used</text>
<rect x="80" y="362" width="260" height="54" fill="#cfe2ff" stroke="#334155" stroke-width="1.2"/>
<text x="210.0" y="394.0" text-anchor="middle" font-size="13" font-weight="bold">.bss / .data / .text</text>
<line x1="92" y1="126" x2="92" y2="190" stroke="#be3f86" stroke-width="1.5" marker-end="url(#arrow-stack)"/>
<line x1="318" y1="194" x2="318" y2="220" stroke="#be3f86" stroke-width="1.5" marker-end="url(#arrow-stack)"/>
<text x="312" y="211.0" text-anchor="end" font-size="10" font-style="italic" fill="#be3f86">grows down</text>
<line x1="92" y1="356" x2="92" y2="312" stroke="#b7791f" stroke-width="1.5" marker-end="url(#arrow-heap)"/>
<line x1="318" y1="308" x2="318" y2="282" stroke="#b7791f" stroke-width="1.5" marker-end="url(#arrow-heap)"/>
<text x="312" y="299.0" text-anchor="end" font-size="10" font-style="italic" fill="#b7791f">grows up</text>
<text x="70" y="92" text-anchor="end" font-size="11" fill="#475569">high</text>
<text x="70" y="106" text-anchor="end" font-size="11" fill="#475569">address</text>
<text x="70" y="398" text-anchor="end" font-size="11" fill="#475569">low</text>
<text x="70" y="412" text-anchor="end" font-size="11" fill="#475569">address</text>
<text x="20" y="446" font-size="12" fill="#334155">Like RISC-V, LoongArch has no PUSH or POP instruction; compilers lower $sp, so the stack grows down by convention.</text>
<text x="20" y="464" font-size="12" fill="#334155">Not tested in the project&#x27;s CI. Shown for orientation only.</text>
<text x="20" y="482" font-size="12" fill="#334155">Small arrows show the direction in which a region grows: down for stacks, up for heaps.</text>
</svg>
