<svg xmlns="http://www.w3.org/2000/svg" width="846" height="550" viewBox="0 0 846 550" font-family="Helvetica, Arial, sans-serif" fill="#0f172a">
<defs><marker id="arrow-code" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#3b6fb6"/></marker><marker id="arrow-ro" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#3b6fb6"/></marker><marker id="arrow-data" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#2f8f5b"/></marker><marker id="arrow-bss" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#2f8f5b"/></marker><marker id="arrow-heap" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#b7791f"/></marker><marker id="arrow-free" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/></marker><marker id="arrow-stack" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#be3f86"/></marker><marker id="arrow-guard" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#c53030"/></marker><marker id="arrow-kernel" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#6b7280"/></marker><marker id="arrow-map" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#7e57c2"/></marker><marker id="arrow-vec" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#4f5bd5"/></marker><marker id="arrow-os" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#c2620f"/></marker><marker id="arrow-buf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#0f8a7e"/></marker></defs>
<rect width="846" height="550" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="bold">Bare metal (no OS): stack and memory, as used by Adaptive_JSON5</text>
<text x="210.0" y="66" text-anchor="middle" font-weight="bold" font-size="15">RAM</text>
<rect x="80" y="80" width="260" height="80" fill="#fbcfe8" stroke="#334155" stroke-width="1.2"/>
<text x="210.0" y="117.0" text-anchor="middle" font-size="13" font-weight="bold">Main stack</text>
<text x="210.0" y="133.0" text-anchor="middle" font-size="11" font-weight="normal">set from the vector table / startup code</text>
<text x="352" y="124.0" font-size="11" fill="#334155">starts at the top of RAM</text>
<rect x="80" y="160" width="260" height="110" fill="#f8fafc" stroke="#334155" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="210.0" y="220.0" text-anchor="middle" font-size="13" font-weight="bold">free RAM</text>
<text x="352" y="219.0" font-size="11" fill="#334155">room for the stack to grow</text>
<rect x="80" y="270" width="260" height="34" fill="#fca5a5" stroke="#334155" stroke-width="1.2"/>
<text x="210.0" y="284.0" text-anchor="middle" font-size="13" font-weight="bold">Guard region</text>
<text x="210.0" y="300.0" text-anchor="middle" font-size="11" font-weight="normal">MPU / PMP / stack limit</text>
<text x="352" y="291.0" font-size="11" fill="#334155">protected: an access here faults</text>
<rect x="80" y="304" width="260" height="60" fill="#99f6e4" stroke="#334155" stroke-width="1.2"/>
<text x="210.0" y="331.0" text-anchor="middle" font-size="13" font-weight="bold">Adaptive_JSON5 buffer</text>
<text x="210.0" y="347.0" text-anchor="middle" font-size="11" font-weight="normal">caller-provided, fixed size</text>
<text x="352" y="338.0" font-size="11" fill="#334155">all parser storage lives here</text>
<rect x="80" y="364" width="260" height="50" fill="#bbf7d0" stroke="#334155" stroke-width="1.2"/>
<text x="210.0" y="386.0" text-anchor="middle" font-size="13" font-weight="bold">.bss</text>
<text x="210.0" y="402.0" text-anchor="middle" font-size="11" font-weight="normal">zero-initialised globals</text>
<text x="352" y="393.0" font-size="11" fill="#334155">cleared by startup code</text>
<rect x="80" y="414" width="260" height="50" fill="#d1fae5" stroke="#334155" stroke-width="1.2"/>
<text x="210.0" y="436.0" text-anchor="middle" font-size="13" font-weight="bold">.data</text>
<text x="210.0" y="452.0" text-anchor="middle" font-size="11" font-weight="normal">initialised globals</text>
<text x="352" y="443.0" font-size="11" fill="#334155">copied from flash at startup</text>
<line x1="92" y1="86" x2="92" y2="154" stroke="#be3f86" stroke-width="1.5" marker-end="url(#arrow-stack)"/>
<line x1="318" y1="158" x2="318" y2="184" stroke="#be3f86" stroke-width="1.5" marker-end="url(#arrow-stack)"/>
<text x="312" y="175.0" text-anchor="end" font-size="10" font-style="italic" fill="#be3f86">grows down</text>
<text x="70" y="92" text-anchor="end" font-size="11" fill="#475569">high</text>
<text x="70" y="106" text-anchor="end" font-size="11" fill="#475569">address</text>
<text x="70" y="446" text-anchor="end" font-size="11" fill="#475569">low</text>
<text x="70" y="460" text-anchor="end" font-size="11" fill="#475569">address</text>
<text x="20" y="494" font-size="12" fill="#334155">No heap: the library never calls new or malloc. The integrator&#x27;s buffer is usually a static array (.bss) or a reserved region.</text>
<text x="20" y="512" font-size="12" fill="#334155">Typical, not universal: the linker script decides the real order and addresses.</text>
<text x="20" y="530" font-size="12" fill="#334155">Small arrows show the direction in which a region grows: down for stacks, up for heaps.</text>
</svg>
