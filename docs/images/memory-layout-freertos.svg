<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="476" viewBox="0 0 1120 476" font-family="Helvetica, Arial, sans-serif" fill="#0f172a">
<defs><marker id="arrow-code" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#3b6fb6"/></marker><marker id="arrow-ro" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#3b6fb6"/></marker><marker id="arrow-data" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#2f8f5b"/></marker><marker id="arrow-bss" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#2f8f5b"/></marker><marker id="arrow-heap" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#b7791f"/></marker><marker id="arrow-free" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/></marker><marker id="arrow-stack" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#be3f86"/></marker><marker id="arrow-guard" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#c53030"/></marker><marker id="arrow-kernel" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#6b7280"/></marker><marker id="arrow-map" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#7e57c2"/></marker><marker id="arrow-vec" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#4f5bd5"/></marker><marker id="arrow-os" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#c2620f"/></marker><marker id="arrow-buf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#0f8a7e"/></marker></defs>
<rect width="1120" height="476" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="bold">FreeRTOS on a microcontroller (example: Cortex-M)</text>
<text x="210.0" y="66" text-anchor="middle" font-weight="bold" font-size="15">Flash</text>
<rect x="80" y="80" width="260" height="40" fill="#d1fae5" stroke="#334155" stroke-width="1.2"/>
<text x="210.0" y="105.0" text-anchor="middle" font-size="13" font-weight="bold">.data load image</text>
<rect x="80" y="120" width="260" height="50" fill="#dbeafe" stroke="#334155" stroke-width="1.2"/>
<text x="210.0" y="150.0" text-anchor="middle" font-size="13" font-weight="bold">.rodata</text>
<rect x="80" y="170" width="260" height="90" fill="#cfe2ff" stroke="#334155" stroke-width="1.2"/>
<text x="210.0" y="212.0" text-anchor="middle" font-size="13" font-weight="bold">.text</text>
<text x="210.0" y="228.0" text-anchor="middle" font-size="11" font-weight="normal">kernel + application</text>
<rect x="80" y="260" width="260" height="40" fill="#c7d2fe" stroke="#334155" stroke-width="1.2"/>
<text x="210.0" y="285.0" text-anchor="middle" font-size="13" font-weight="bold">Vector table</text>
<text x="70" y="92" text-anchor="end" font-size="11" fill="#475569">high</text>
<text x="70" y="106" text-anchor="end" font-size="11" fill="#475569">address</text>
<text x="70" y="282" text-anchor="end" font-size="11" fill="#475569">low</text>
<text x="70" y="296" text-anchor="end" font-size="11" fill="#475569">address</text>
<text x="730.0" y="66" text-anchor="middle" font-weight="bold" font-size="15">RAM</text>
<rect x="600" y="80" width="260" height="50" fill="#fbcfe8" stroke="#334155" stroke-width="1.2"/>
<text x="730.0" y="102.0" text-anchor="middle" font-size="13" font-weight="bold">Main stack (MSP)</text>
<text x="730.0" y="118.0" text-anchor="middle" font-size="11" font-weight="normal">startup and interrupts</text>
<rect x="600" y="130" width="260" height="80" fill="#f8fafc" stroke="#334155" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="730.0" y="175.0" text-anchor="middle" font-size="13" font-weight="bold">free RAM</text>
<rect x="600" y="210" width="260" height="80" fill="#fde68a" stroke="#334155" stroke-width="1.2"/>
<text x="730.0" y="247.0" text-anchor="middle" font-size="13" font-weight="bold">ucHeap[configTOTAL_HEAP_SIZE]</text>
<text x="730.0" y="263.0" text-anchor="middle" font-size="11" font-weight="normal">FreeRTOS heap (heap_1..5) in .bss</text>
<text x="872" y="254.0" font-size="11" fill="#334155">task stacks + TCBs from xTaskCreate()</text>
<rect x="600" y="290" width="260" height="50" fill="#fed7aa" stroke="#334155" stroke-width="1.2"/>
<text x="730.0" y="312.0" text-anchor="middle" font-size="13" font-weight="bold">Static task stacks</text>
<text x="730.0" y="328.0" text-anchor="middle" font-size="11" font-weight="normal">xTaskCreateStatic()</text>
<text x="872" y="319.0" font-size="11" fill="#334155">arrays the application provides</text>
<rect x="600" y="340" width="260" height="50" fill="#d1fae5" stroke="#334155" stroke-width="1.2"/>
<text x="730.0" y="362.0" text-anchor="middle" font-size="13" font-weight="bold">.bss / .data</text>
<text x="730.0" y="378.0" text-anchor="middle" font-size="11" font-weight="normal">globals</text>
<line x1="612" y1="86" x2="612" y2="124" stroke="#be3f86" stroke-width="1.5" marker-end="url(#arrow-stack)"/>
<line x1="838" y1="128" x2="838" y2="154" stroke="#be3f86" stroke-width="1.5" marker-end="url(#arrow-stack)"/>
<text x="832" y="145.0" text-anchor="end" font-size="10" font-style="italic" fill="#be3f86">grows down</text>
<line x1="612" y1="284" x2="612" y2="216" stroke="#b7791f" stroke-width="1.5" marker-end="url(#arrow-heap)"/>
<line x1="612" y1="296" x2="612" y2="334" stroke="#c2620f" stroke-width="1.5" marker-end="url(#arrow-os)"/>
<text x="590" y="92" text-anchor="end" font-size="11" fill="#475569">high</text>
<text x="590" y="106" text-anchor="end" font-size="11" fill="#475569">address</text>
<text x="590" y="372" text-anchor="end" font-size="11" fill="#475569">low</text>
<text x="590" y="386" text-anchor="end" font-size="11" fill="#475569">address</text>
<text x="20" y="420" font-size="12" fill="#334155">Each task has its own stack. With xTaskCreate() it is taken from the FreeRTOS heap; with xTaskCreateStatic() the application provides it.</text>
<text x="20" y="438" font-size="12" fill="#334155">Task stacks grow down inside their block. configCHECK_FOR_STACK_OVERFLOW adds a software check; an MPU port can add a hardware guard.</text>
<text x="20" y="456" font-size="12" fill="#334155">Small arrows show the direction in which a region grows: down for stacks, up for heaps.</text>
</svg>
