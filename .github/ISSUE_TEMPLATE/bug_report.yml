name: Bug report
description: Report an incorrect result or build problem.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        **Security problem?** Do not post the details here. Follow
        [SECURITY.md](https://github.com/Romanr92/Adaptive_JSON5/blob/main/SECURITY.md):
        open a short issue that only says "Possible security issue, please contact me".
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the affected syntax mode, API and requirement ID when known.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include exact input bytes or a small C++ example and the result.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and build configuration
      description: Commit/version, OS, compiler, exception setting and enabled components.
    validations:
      required: true
