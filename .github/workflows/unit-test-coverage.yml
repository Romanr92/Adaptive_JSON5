name: unit-test-coverage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Unit test coverage report (GCC)
    runs-on: ubuntu-24.04
    env:
      ADAPTIVE_JSON5_REQUIRE_COMMA_LOCALE: '1'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # J5-052: a comma-decimal locale, so the locale-independence unit test runs instead of skipping.
      - if: runner.os == 'Linux'
        name: Generate a comma-decimal locale
        run: |
          sudo apt-get update
          sudo apt-get install --yes locales
          sudo locale-gen de_DE.UTF-8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++-14 ninja-build
          python -m pip install gcovr==8.6
      # Intermediate gate: fails below 90% line, function or branch coverage.
      # The report and badges are still produced for a failing run.
      - name: Build and run units, generate coverage HTML
        id: coverage
        run: python tools/coverage.py --compiler g++-14 --gcov gcov-14 --fail-under 90
      - name: Generate measured coverage badges
        if: ${{ !cancelled() && hashFiles('build/coverage/report/summary.json') != '' }}
        run: >-
          python3 tools/metric_badges.py coverage build/coverage/report/summary.json
          --output build/coverage/report/coverage.svg --output-dir build/coverage/report
      - name: Upload unit test coverage HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage-html
          path: build/coverage/report/
          if-no-files-found: error
          retention-days: 30

  publish-badge:
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-metric-badge.yml
    with:
      artifact: unit-test-coverage-html
      metric: coverage
      files: coverage.svg,coverage-lines.svg,coverage-functions.svg,coverage-branches.svg
