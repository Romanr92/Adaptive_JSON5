name: compiler-diversity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-diversity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compiler-tests:
    name: compiler-tests (${{ matrix.compiler }}, exceptions ${{ matrix.exceptions }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-13, clang++-18]
        exceptions: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install compilers and build tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++-13 clang-18 ninja-build
      - name: Record compiler and configuration
        run: |
          ${{ matrix.compiler }} --version | tee compiler-version.txt
          echo 'Debug; C++17; libstdc++; exceptions=${{ matrix.exceptions }}; RTTI=OFF' | tee -a compiler-version.txt
      - name: Configure units and validation
        run: >-
          cmake -S . -B build/compiler-tests -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DADAPTIVE_JSON5_BUILD_LIBRARY=ON
          -DADAPTIVE_JSON5_BUILD_TESTS=ON
          -DADAPTIVE_JSON5_BUILD_VALIDATION_TESTS=ON
          -DADAPTIVE_JSON5_ENABLE_EXCEPTIONS=${{ matrix.exceptions }}
          -DADAPTIVE_JSON5_ENABLE_RTTI=OFF
      - name: Compile units and validation
        run: cmake --build build/compiler-tests --parallel "$(nproc)"
      - name: Run units and validation
        run: ctest --test-dir build/compiler-tests --parallel "$(nproc)" --output-on-failure --no-tests=error --output-junit results.xml
      - name: Preserve compiler and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-tests-${{ matrix.compiler }}-${{ matrix.exceptions }}
          path: |
            compiler-version.txt
            build/compiler-tests/results.xml
            build/compiler-tests/CMakeCache.txt
            build/compiler-tests/compile_commands.json
            build/compiler-tests/Testing/Temporary/LastTest.log

  # Requirement -> code -> tests -> result, from the registry and the four results above.
  # Runs after failed test jobs too, so failures appear as gaps rather than as no report.
  traceability:
    name: Requirements traceability report
    needs: compiler-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run analyzer units
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Download compiler test evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: compiler-tests-*
          path: evidence
      - name: Check the registry and generate the report
        run: |
          arguments=()
          for configuration in g++-13-OFF g++-13-ON clang++-18-OFF clang++-18-ON; do
            results="$(find "evidence/compiler-tests-$configuration" -name results.xml -print -quit 2>/dev/null || true)"
            if [ -n "$results" ]; then arguments+=(--junit "$configuration=$results"); fi
          done
          python3 tools/traceability.py --output-dir build/traceability "${arguments[@]}"
      - name: Show unknown for any badge that could not be measured
        if: ${{ !cancelled() }}
        run: python3 tools/traceability.py --unknown-badges build/traceability
      - name: Upload traceability report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: traceability-report-html
          path: build/traceability/
          if-no-files-found: error
          retention-days: 30

  # Only main pushes publish; pull-request code never reaches this write-permission job.
  publish-traceability:
    needs: traceability
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-metric-badge.yml
    with:
      artifact: traceability-report-html
      metric: traceability
      files: traceability-implementation.svg,traceability-tests.svg,traceability-passing.svg,traceability.json,traceability.html
