name: misra-cpp

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  misra-cpp:
    name: MISRA C++ 2023 (Clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Clang and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 ninja-build
          clang++-18 --version
      # Configure before CodeQL starts tracing, so CMake's compiler-detection sources
      # (build/misra/CMakeFiles/*/CompilerIdCXX) are not analysed as project code.
      - name: Configure production analysis build
        run: >-
          cmake -S . -B build/misra -G Ninja
          -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=Debug
          -DADAPTIVE_JSON5_BUILD_LIBRARY=ON
          -DADAPTIVE_JSON5_BUILD_EXECUTABLE=OFF
          -DADAPTIVE_JSON5_BUILD_TESTS=OFF
          -DADAPTIVE_JSON5_BUILD_VALIDATION_TESTS=OFF
          -DADAPTIVE_JSON5_ENABLE_EXCEPTIONS=OFF
          -DADAPTIVE_JSON5_ENABLE_RTTI=OFF
      - name: Initialize CodeQL MISRA and security analysis
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          config-file: .github/codeql/misra.yml
      - name: Index MISRA source deviations
        run: python3 tools/misra_check.py --index-deviations
      - name: Trace Clang compilation
        run: cmake --build build/misra --parallel "$(nproc)"
      - name: Run CodeQL MISRA and security analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: misra-cpp-2023-clang
          output: build/misra-sarif
          upload: never
      - name: Generate MISRA HTML report
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          reports=(build/misra-sarif/*.sarif)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo 'No SARIF report was produced.'
            exit 1
          fi
          for report in "${reports[@]}"; do
            python3 tools/misra_check.py --prepare-sarif "$report" \
              --upload-sarif "build/misra-open-sarif/${report##*/}" --no-open
          done
      - name: Upload open CodeQL findings
        uses: github/codeql-action/upload-sarif@v4
        with:
          category: misra-cpp-2023-clang
          sarif_file: build/misra-open-sarif
      - name: Generate measured MISRA / CodeQL badges
        run: >-
          python3 tools/metric_badges.py misra build/misra-sarif/*.sarif
          --output build/misra-sarif/misra.svg --output-dir build/misra-sarif
      - name: Upload MISRA reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: misra-report-html
          path: build/misra-sarif/
          if-no-files-found: error
          retention-days: 30

  publish-badge:
    needs: misra-cpp
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-metric-badge.yml
    with:
      artifact: misra-report-html
      metric: misra
      files: misra.svg,misra-critical.svg,misra-high.svg,misra-medium.svg,misra-low.svg,misra-unrated.svg
