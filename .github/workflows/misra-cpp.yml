name: misra-cpp

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  misra-cpp:
    name: MISRA C++ 2023 (Clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Clang and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 ninja-build
          clang++-18 --version
      - name: Initialize CodeQL MISRA and security analysis
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          config-file: .github/codeql/misra.yml
      - name: Configure production analysis build
        run: >-
          cmake -S . -B build/misra -G Ninja
          -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=Debug
          -DADAPTIVE_JSON5_BUILD_LIBRARY=ON
          -DADAPTIVE_JSON5_BUILD_EXECUTABLE=OFF
          -DADAPTIVE_JSON5_BUILD_TESTS=OFF
          -DADAPTIVE_JSON5_BUILD_VALIDATION_TESTS=OFF
          -DADAPTIVE_JSON5_ENABLE_EXCEPTIONS=OFF
          -DADAPTIVE_JSON5_ENABLE_RTTI=OFF
      - name: Trace Clang compilation
        run: cmake --build build/misra --parallel "$(nproc)"
      - name: Run CodeQL MISRA and security analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: misra-cpp-2023-clang
          output: build/misra-sarif
      - name: Generate MISRA HTML report
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          reports=(build/misra-sarif/*.sarif)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo 'No SARIF report was produced.'
            exit 1
          fi
          for report in "${reports[@]}"; do
            python3 tools/misra_check.py --report "$report" --no-open
          done
      - name: Upload MISRA reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: misra-report-html
          path: build/misra-sarif/
          if-no-files-found: error
          retention-days: 30
