name: publish-metric-badge

on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
      metric:
        required: true
        type: string
      files:
        description: Comma-separated artifact files to publish; defaults to <metric>.svg
        required: false
        type: string
        default: ''
      require_main_head:
        description: Skip when main has moved past this run's commit (off for release-driven badges)
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish-badge-${{ inputs.metric }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: metric-report
      - uses: actions/github-script@v7
        env:
          METRIC: ${{ inputs.metric }}
          FILES: ${{ inputs.files }}
          REQUIRE_MAIN_HEAD: ${{ inputs.require_main_head }}
        with:
          script: |
            const fs = require('fs');
            const metric = process.env.METRIC;
            if (!['coverage', 'misra', 'traceability', 'version'].includes(metric)) throw new Error('Unknown metric');
            const files = (process.env.FILES || `${metric}.svg`).split(',').map((name) => name.trim());
            if (files.some((name) => !/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(name))) throw new Error('Invalid file name');
            const { owner, repo } = context.repo;
            const branch = `metrics-${metric}`;
            if (process.env.REQUIRE_MAIN_HEAD === 'true') {
              const main = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
              // A slower, older run must not overwrite the latest main metrics.
              if (main.data.object.sha !== context.sha) {
                core.notice('Main advanced; skipping stale badge publication');
                return;
              }
            }
            // A failed analysis may upload only its badges; publish what exists, never nothing.
            const present = files.filter((name) => fs.existsSync(`metric-report/${name}`));
            if (present.length === 0) throw new Error('No files to publish');
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: context.sha });
            }
            for (const name of present) {
              let sha;
              try {
                const old = await github.rest.repos.getContent({ owner, repo, path: name, ref: branch });
                sha = old.data.sha;
              } catch (error) { if (error.status !== 404) throw error; }
              const content = fs.readFileSync(`metric-report/${name}`).toString('base64');
              await github.rest.repos.createOrUpdateFileContents({ owner, repo, branch,
                path: name, sha, content,
                message: `Update ${metric} ${name} for ${context.sha}` });
            }
