name: publish-metric-badge

on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
      metric:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-badge-${{ inputs.metric }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: metric-report
      - uses: actions/github-script@v7
        env:
          METRIC: ${{ inputs.metric }}
        with:
          script: |
            const fs = require('fs');
            const metric = process.env.METRIC;
            if (!['coverage', 'misra'].includes(metric)) throw new Error('Unknown metric');
            const { owner, repo } = context.repo;
            const branch = `metrics-${metric}`;
            const main = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            // A slower, older run must not overwrite the latest main metrics.
            if (main.data.object.sha !== context.sha) {
              core.notice('Main advanced; skipping stale badge publication');
              return;
            }
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: context.sha });
            }
            let sha;
            try {
              const old = await github.rest.repos.getContent({ owner, repo, path: `${metric}.svg`, ref: branch });
              sha = old.data.sha;
            } catch (error) { if (error.status !== 404) throw error; }
            const content = fs.readFileSync(`metric-report/${metric}.svg`).toString('base64');
            await github.rest.repos.createOrUpdateFileContents({ owner, repo, branch,
              path: `${metric}.svg`, sha, content,
              message: `Update ${metric} badge for ${context.sha}` });
